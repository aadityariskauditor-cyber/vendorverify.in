/* ══════════════════════════════════════
   DESIGN TOKENS — Light Theme
══════════════════════════════════════ */
:root {

  --shadow-md:  0 8px 32px rgba(0,62,72,0.12);

  /* Icon accent palette */

  --icon-blue:   #1d6fa4;
  --icon-amber:  #d97706;
  --icon-red:    #dc2626;
  --icon-purple: #7c3aed;
